version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: aegis
      POSTGRES_PASSWORD: aegis_pass
      POSTGRES_DB: aegis
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aegis"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://aegis:aegis_pass@db:5432/aegis
      - REDIS_URL=redis://redis:6379/0
      - ENVIRONMENT=production
      # - SECRET_KEY=generate_a_secure_key_and_put_it_here
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    command: >
      sh -c "alembic upgrade head && 
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:80"
    environment:
      - VITE_API_URL=/api/v1
    depends_on:
      - backend

volumes:
  postgres_data:
